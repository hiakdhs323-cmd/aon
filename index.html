<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>AonWiki</title>
<link rel="stylesheet" href="style.css?v=20261101-wiki-redesign">
</head>
<body>
<header class="site-header">
  <a class="brand" href="#/대문" aria-label="AonWiki 대문"><span class="brand-symbol">A</span><span class="brand-name">Aon<span>Wiki</span></span></a>
  <form id="search" class="searchbar" role="search"><input id="query" placeholder="AonWiki에서 검색" aria-label="문서 검색" autocomplete="off"><button type="submit">검색</button></form>
  <nav class="header-actions"><button id="login" class="button button-plain" type="button">로그인</button><button id="settings" class="button button-plain" type="button" title="API 설정">설정</button><button id="edit" class="button button-primary" type="button">편집</button></nav>
</header>
<div class="layout">
  <aside class="left-nav" aria-label="위키 메뉴">
    <div class="nav-heading">AonWiki</div>
    <button id="home" class="nav-item active" type="button">대문</button>
    <button id="new" class="nav-item" type="button">새 문서</button>
    <div class="nav-separator"></div>
    <div class="nav-heading">문서</div>
    <button id="history" class="nav-item" type="button">문서 역사</button>
    <button id="upload" class="nav-item" type="button">이미지 업로드</button>
    <p class="nav-caption">AonWiki · 함께 만드는 지식</p>
  </aside>
  <main class="main">
    <div class="breadcrumbs"><a href="#/대문">AonWiki</a><span>›</span><span id="crumb">대문</span></div>
    <section class="article">
      <div class="article-titlebar"><h1 id="title">대문</h1><button id="heading-edit" class="title-edit" type="button" aria-label="문서 편집">편집</button></div>
      <div class="article-tools"><span class="current-tab">문서</span><button id="history-tab" type="button">역사</button><span class="tool-spacer"></span><span class="article-language">한국어</span></div>
      <div id="message" class="notice" role="status">문서를 불러오는 중입니다…</div>
      <article id="article" class="wiki-content">AonWiki에 오신 것을 환영합니다.</article>
      <footer class="article-footer"><span>AonWiki</span><span>이 문서는 지식 공유를 위해 제공됩니다.</span></footer>
    </section>
    <footer class="site-footer">AonWiki · 문서 내용은 이용자가 작성합니다.</footer>
  </main>
</div>
<dialog id="dialog">
  <div class="dialog-head"><h2 id="dialog-title">설정</h2><button id="cancel" class="dialog-close" type="button" aria-label="닫기">×</button></div>
  <div id="dialog-body"></div><p id="dialog-status" class="dialog-status" role="status"></p>
  <div class="dialog-actions"><button id="save" class="button button-primary" type="button">저장</button></div>
</dialog>
<input id="file" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
<script src="app.js?v=20261101-wiki-redesign"></script>
</body></html>
