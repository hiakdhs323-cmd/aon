name: Build NamuMark parser
on:
  push:
    branches: [main]
    paths:
      - "parser-src/**"
      - "worker/src/index.js"
      - "app.js"
      - ".github/workflows/build-namumark.yml"
      - "tests/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify frontend JavaScript syntax
        run: node --check app.js
      - name: Bundle parser for browser
        run: npx --yes esbuild@0.25.0 parser-src/index.ts --bundle --format=iife --global-name=NamuMarkBundle --target=es2020 --outfile=namumark-parser.js
      - name: Bundle parser for Cloudflare Worker
        run: npx --yes esbuild@0.25.0 parser-src/index.ts --bundle --format=esm --target=es2020 --outfile=worker/src/namumark-parser.js
      - name: Smoke test generated parser output
        run: node tests/namumark-smoke.cjs
      - name: Bundle Cloudflare Worker entrypoint
        run: |
          npx --yes esbuild@0.25.0 worker/src/index.js --bundle --format=esm --target=es2020 --outfile=worker/dist/index.js
          node --check worker/dist/index.js
      - name: Commit generated bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add namumark-parser.js worker/src/namumark-parser.js worker/dist/index.js
          if git diff --cached --quiet; then
            echo "No parser changes."
          else
            git commit -m "Build browser NamuMark parser [skip ci]"
            git push
          fi
