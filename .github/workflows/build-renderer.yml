name: Build AonWiki Namu_test-main renderer

on:
  push:
    branches: [main]
    paths:
      - "Namu_test-main/**"
      - "editor/**"
      - "scripts/build-monaco.mjs"
      - "scripts/build-browser.mjs"
      - "package.json"
      - "package-lock.json"
      - "namumark-wasm.js"
      - "app.js"
      - "index.html"
      - "style.css"
      - "namumark-aon.css"
      - "namumark-interactions-aon.css"
      - "Namu_test-main/interactions.js"
      - "worker/src/index.js"
      - "wrangler.toml"
      - ".assetsignore"
      - "tests/**"
      - ".github/workflows/build-renderer.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aonwiki-renderer-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install pinned Monaco build dependency
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
          npm ci --no-audit --no-fund
      - name: Build single browser runtime bundle
        run: node scripts/build-browser.mjs
      - name: Build local Monaco editor and worker
        run: node scripts/build-monaco.mjs
      - name: Verify frontend JavaScript syntax
        run: |
          node --input-type=module --check < app.js
          node --input-type=module --check < app.bundle.js
          node --check editor/monaco-entry.js
          node --check editor/monaco-worker.js
      - name: Verify Monaco build outputs
        run: node tests/monaco-editor-smoke.cjs
      - name: Verify single renderer integration
        run: node tests/namutest-renderer-smoke.cjs
      - name: Verify browser source bundling
        run: node tests/frontend-bundle-smoke.cjs
      - name: Verify NamuMark editor syntax highlighting
        run: node tests/editor-highlighter-smoke.cjs
      - name: Probe supported AonWiki markup syntax
        run: node tests/markup-reference-smoke.cjs
      - name: Bundle Cloudflare Worker
        run: |
          npx --yes esbuild@0.25.0 worker/src/index.js --bundle --format=esm --target=es2020 --loader:.wasm=binary --outfile=worker/dist/index.js
          node --check worker/dist/index.js
      - name: Commit generated Worker bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json app.bundle.js worker/dist/index.js editor-monaco/monaco.js editor-monaco/monaco.worker.js editor-monaco/monaco.css editor-monaco/LICENSE.monaco.txt
          if git diff --cached --quiet; then
            echo "Worker bundle is up to date."
          else
            git commit -m "Build AonWiki Namu_test-main Worker bundle"
            git push
          fi
